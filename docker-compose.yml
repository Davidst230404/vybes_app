services:
  postgres:
    image: postgres:17
    container_name: vybes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vybes
      POSTGRES_USER: vybes
      POSTGRES_PASSWORD: vybes_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vybes-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: